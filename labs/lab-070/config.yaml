metadata:
  name: "ats-002-lab-070"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-070-zypperbox-setup"
      description: "Installs Docker on the Ubuntu host, starts the zypperbox openSUSE Leap 15.6 container, adds the network-utilities repo, seeds telnet-server installed and fail2ban absent, and pre-creates /root/answers for the student's research findings"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-research-search-answer"
      description: "Confirms /root/answers/01-research-search.txt records a zypper search hit for fail2ban"
      type: "file"
      source: "validation/validate-research-search-answer.sh"

    - name: "verify-research-info-answer"
      description: "Confirms /root/answers/02-research-info.txt records zypper info metadata for fail2ban"
      type: "file"
      source: "validation/validate-research-info-answer.sh"

    - name: "verify-telnet-confirmation-answer"
      description: "Confirms /root/answers/03-confirm-telnet-installed.txt records telnet-server correctly confirmed as installed via an installed-only search"
      type: "file"
      source: "validation/validate-telnet-confirmation-answer.sh"

    - name: "verify-fail2ban-installed"
      description: "Confirms fail2ban is installed inside zypperbox"
      type: "file"
      source: "validation/validate-fail2ban-installed.sh"

    - name: "verify-telnetd-removed"
      description: "Confirms telnet-server has been removed from zypperbox"
      type: "file"
      source: "validation/validate-telnetd-removed.sh"

teardown:
  keepCluster: false
