metadata:
  name: "ats-002-lab-033"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-033-setup"
      description: "Installs libvirt/QEMU, starts libvirtd with the default NAT network, stages an empty 2G qcow2 at /var/lib/libvirt/images/metrics-cache.qcow2, writes /root/metrics-cache.xml, and starts 'metrics-cache' as a TRANSIENT domain with 'virsh create' (running, no persistent definition)"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-metrics-cache-persisted"
      description: "Confirms metrics-cache is now persistently defined (with its original 1024 MiB / 1 vCPU / default-network / disk spec preserved), has autostart enabled, and has an on-disk definition at /etc/libvirt/qemu/metrics-cache.xml"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
