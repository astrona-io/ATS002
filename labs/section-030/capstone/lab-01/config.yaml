metadata:
  name: "ats-002-lab-030"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-030-setup"
      description: "Stages the vmreport-1.0.tar.gz source tarball at /tools/, installs build-essential and libvirt/QEMU tooling, starts libvirtd with its default network active, and stages an empty 2G qcow2 disk at /var/lib/libvirt/images/build-agent.qcow2"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-vmreport-binary"
      description: "Confirms vmreport is installed at /usr/local/bin/vmreport, is a real compiled ELF binary, and was built with color output disabled"
      type: "file"
      source: "validation/validate-vmreport-binary.sh"

    - name: "verify-build-agent-domain"
      description: "Confirms build-agent is defined persistently with 2048 MiB memory, 2 vCPUs, the default network attached, and autostart enabled"
      type: "file"
      source: "validation/validate-build-agent-domain.sh"

    - name: "verify-build-agent-running"
      description: "Confirms the build-agent domain was actually started, not just defined"
      type: "file"
      source: "validation/validate-build-agent-running.sh"

    - name: "verify-vmreport-integration"
      description: "Confirms the compiled vmreport tool can query the real build-agent domain and correctly reports its running state"
      type: "file"
      source: "validation/validate-vmreport-integration.sh"

teardown:
  keepCluster: false
