metadata:
  name: "ats-002-lab-010"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    # NOTE: real USB passthrough isn't available in this QEMU sandbox, so the
    # "newly attached telemetry disk" step of the story is an extraDisk
    # identified by a stable `serial` attribute. As with other labs using
    # extraDisks, astrona-cli does not guarantee this disk lands on any
    # particular /dev/vdX letter, so bootstrap/validation resolve it via the
    # always-present /dev/disk/by-id/virtio-<serial> path instead.
    extraDisks:
      - sizeGB: 1
        serial: "lab010-telemetry"
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "lab-010-setup"
      description: "Sets up the capstone starting state: /opt/course/audit dir, a low kernel.pid_max baseline, pcspkr loaded, the telemetry extraDisk, and a hung telemetry-agent.service stuck in pause()"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-audit-files"
      description: "Confirms /opt/course/audit/kernel-release and /opt/course/audit/vm-swappiness match the live system state"
      type: "file"
      source: "validation/validate-audit-files.sh"

    - name: "verify-pid-max-raised"
      description: "Confirms kernel.pid_max is raised live and persisted via /etc/sysctl.d/"
      type: "file"
      source: "validation/validate-pid-max.sh"

    - name: "verify-kernel-modules"
      description: "Confirms dummy is loaded with numdummies=4 persistently, and pcspkr is blacklisted and unloaded"
      type: "file"
      source: "validation/validate-kernel-modules.sh"

    - name: "verify-telemetry-disk-symlink"
      description: "Confirms a custom udev rule creates a stable /dev/telemetry-disk symlink for the disk with serial lab010-telemetry"
      type: "file"
      source: "validation/validate-telemetry-disk-symlink.sh"

    - name: "verify-telemetry-agent-killed"
      description: "Confirms the hung telemetry-agent process (stuck in pause()) has been terminated"
      type: "file"
      source: "validation/validate-telemetry-agent-killed.sh"

teardown:
  keepCluster: false
