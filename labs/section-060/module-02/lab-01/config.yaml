metadata:
  name: "ats-002-lab-062"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-062-setup"
      description: "Installs Docker, starts the rpmbox Rocky Linux 9 container, installs a handful of real packages, then genuinely corrupts its sqlite-backed RPM database"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-rpmdb-queryable"
      description: "Confirms rpm -qa inside rpmbox completes cleanly with no database errors and a plausible package count"
      type: "file"
      source: "validation/validate-rpmdb-queryable.sh"

    - name: "verify-dnf-check-clean"
      description: "Confirms dnf check inside rpmbox passes cleanly against the rebuilt database"
      type: "file"
      source: "validation/validate-dnf-check-clean.sh"

teardown:
  keepCluster: false
