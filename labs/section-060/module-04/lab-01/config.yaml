metadata:
  name: "ats-002-lab-064"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-064-setup"
      description: "Installs Docker, starts the rpmbox Rocky Linux 9 container with EPEL and fresh repo metadata, and installs a few extra python3-* packages"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-search-answer"
      description: "Confirms the student recorded a fail2ban-related dnf search result"
      type: "file"
      source: "validation/validate-search-answer.sh"

    - name: "verify-info-answer"
      description: "Confirms the student recorded dnf info httpd metadata without installing it"
      type: "file"
      source: "validation/validate-info-answer.sh"

    - name: "verify-provides-answer"
      description: "Confirms the student recorded the correct dnf provides result for /usr/sbin/ip"
      type: "file"
      source: "validation/validate-provides-answer.sh"

    - name: "verify-python-answer"
      description: "Confirms the student recorded the installed python3-* package listing"
      type: "file"
      source: "validation/validate-python-answer.sh"

teardown:
  keepCluster: false
