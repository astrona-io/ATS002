metadata:
  name: "ats-002-lab-021"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "lab-021-cron-setup"
      description: "Ensures cron is installed and running, creates the asset-manager user with nightly-sync.sh and clean.sh in its home directory, and seeds a pre-existing system-wide 8:30pm cronjob in /etc/cron.d/asset-cleanup"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-crontab-entries"
      description: "Confirms asset-manager's per-user crontab contains both the converted 8:30pm nightly-sync.sh job and the new Mon/Thu 11:15am clean.sh job"
      type: "file"
      source: "validation/validate-crontab-entries.sh"

    - name: "verify-old-cron-removed"
      description: "Confirms the original system-wide nightly-sync.sh entry no longer exists in /etc/crontab or /etc/cron.d/"
      type: "file"
      source: "validation/validate-old-cron-removed.sh"

teardown:
  keepCluster: false
