metadata:
  name: "ats-002-lab-061"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-061-setup"
      description: "Installs Docker, starts the rpmbox Rocky Linux 9 container, and builds a real logship-agent-2.1.0-1 RPM inside it"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-installed"
      description: "Confirms logship-agent-2.1.0-1.x86_64 is installed inside rpmbox"
      type: "file"
      source: "validation/validate-installed.sh"

    - name: "verify-file-list"
      description: "Confirms logship-agent's files landed on disk inside rpmbox"
      type: "file"
      source: "validation/validate-file-list.sh"

    - name: "verify-integrity-clean"
      description: "Confirms rpm -V logship-agent reports a clean verify inside rpmbox"
      type: "file"
      source: "validation/validate-verify-clean.sh"

    - name: "verify-requires"
      description: "Confirms logship-agent declares its expected Requires inside rpmbox"
      type: "file"
      source: "validation/validate-requires.sh"

teardown:
  keepCluster: false
