metadata:
  name: "ats-002-lab-012"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "process-limits-lab-setup"
      description: "Creates the dataproc user with a low nproc limit, forces kernel.pid_max down to its legacy default, and starts a data-ingest.service unit with a low TasksMax"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-pid-max-raised"
      description: "Confirms kernel.pid_max is raised live and persisted via /etc/sysctl.d/"
      type: "file"
      source: "validation/validate-pid-max.sh"

    - name: "verify-ulimit-raised"
      description: "Confirms the dataproc user's max-processes (ulimit -u / RLIMIT_NPROC) ceiling is raised persistently via /etc/security/limits.d/"
      type: "file"
      source: "validation/validate-ulimit.sh"

    - name: "verify-tasksmax-raised"
      description: "Confirms data-ingest.service's systemd TasksMax cgroup ceiling is raised and applied to the running unit"
      type: "file"
      source: "validation/validate-tasksmax.sh"

teardown:
  keepCluster: false
