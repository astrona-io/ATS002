metadata:
  name: "ats-002-lab-032"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-032-setup"
      description: "Installs libvirt-daemon-system/qemu-system-x86, starts libvirtd with its default NAT network active, and stages an empty 2G qcow2 disk at /var/lib/libvirt/images/inventory-db.qcow2"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-inventory-db-domain"
      description: "Confirms inventory-db is defined persistently with 2048 MiB memory, 2 vCPUs, the default network attached, and autostart enabled"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
