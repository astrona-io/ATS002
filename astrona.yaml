training:
  id: ATS002
  title: "LFCS: Operations Deployment"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Operations Deployment domain, with hands-on labs
    for each competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Operations Deployment
    weight: 25

modules:
  - id: module-010
    title: "Section 010: Kernel Tuning, Process Limits, and Device Forensics"
    description: >
      Learn to read and persist live kernel state with sysctl, diagnose and
      raise the three independent process/thread ceilings a workload can
      hit, manage kernel modules (parameterized loads and permanent
      blacklisting), give disks stable udev-based names immune to
      device-letter reassignment, and use strace to catch a misbehaving or
      hung process in the act before safely terminating it.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Module 1: Reading and Reshaping the Live Kernel with sysctl"
