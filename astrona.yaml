  - id: module-030
    title: "Section 030: Building & Virtualizing Systems"
    description: >
      Compiling and installing software directly from source when a
      package manager can't help you, and standing up and managing full
      virtual machines with libvirt when a container isn't isolated
      enough — precise control over exactly where a build lands and
      exactly what capabilities a VM ends up with.

