  - id: module-020
    title: "Section 020: Scheduled & Containerized Workloads"
    description: >
      Covers the two mechanisms admins lean on to keep systems running
      unattended: per-user vs. system-wide cron scheduling (and safely
      migrating jobs between them without duplicate execution), and the
      Docker container lifecycle — stopping containers gracefully,
      extracting precise facts from docker inspect via Go templates, and
      launching new containers with exact memory and port constraints.

