  - id: module-040
    title: "Section 040: Mandatory Access Control — SELinux & AppArmor"
    description: >
      Diagnose Mandatory Access Control denials that occur even when
      standard DAC permissions are correct. Hands-on AppArmor profile
      diagnosis and repair on the platform's native Ubuntu image, plus a
      fully worked, honestly-labeled conceptual walkthrough of the
      equivalent SELinux workflow used on RHEL-family exam hosts.

