# Course manifest for ATS002 - Operations Deployment (Linux Foundation
# Certified System Administrator, LFCS).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section quiz and the section capstone close the section.
# Playgrounds are not listed: the landing page's playground marker shows
# them. solution.md files are never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS002
  title: "LFCS: Operations Deployment"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Operations Deployment domain, with hands-on labs for
    each competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Operations Deployment
    weight: 25

modules:

  - id: module-010
    title: "Section 010: Kernel Tuning, Process Limits, and Device Forensics"
    description: >
      Learn to read and persist live kernel state with sysctl, diagnose and
      raise the three independent process/thread ceilings a workload can hit,
      manage kernel modules (parameterized loads and permanent blacklisting),
      give disks stable udev-based names immune to device-letter reassignment,
      and use strace to catch a misbehaving or hung process in the act before
      safely terminating it.

    content:
