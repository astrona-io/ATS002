  - id: module-080
    title: "Section 080: System Disaster Recovery"
    description: >
      A calm, repeatable procedure for getting back into a broken
      machine: chroot-based root filesystem and password repair, GPT
      partition table backup and restoration, and GRUB bootloader
      reinstallation — every boot-breaking scenario safely re-staged onto
      a disposable secondary disk so the grading VM always stays
      SSH-reachable.

