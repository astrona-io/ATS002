# libvirt Virtual Machine Lifecycle (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "libvirt-vm-lifecycle"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Installs libvirt + QEMU, starts libvirtd with its default NAT network active, and stages an empty 2G qcow2 at /var/lib/libvirt/images/inventory-db.qcow2 to define a domain around."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 20
      display: false
      sshPasswordAuth: false
