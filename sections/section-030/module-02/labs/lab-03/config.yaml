metadata:
  name: "ats-002-lab-034"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-034-setup"
      description: "Installs libvirt/QEMU, starts libvirtd with the default NAT network, stages an empty 2G qcow2 at /var/lib/libvirt/images/web-db.qcow2, and defines the persistent domain 'web-db' under-provisioned (512 MiB memory, 1 vCPU) and left shut off"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-web-db-reconfigured"
      description: "Confirms web-db has 2048 MiB memory and 2 vCPUs in BOTH its persistent (inactive) config and its running state, is running, stays persistent, and keeps its original disk and default-network attachment"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
