metadata:
  name: "ats-002-lab-052"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "dpkg-lab-setup"
      description: "Builds a real logtail-utils .deb and stages it under /home/candidate/downloads/, then installs cowsay and manually corrupts its dpkg status entry to half-configured, simulating an interrupted install for recovery practice"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-logtail-installed"
      description: "Confirms logtail-utils is cleanly installed (ii) and /usr/bin/logtail is on disk"
      type: "file"
      source: "validation/validate-logtail-installed.sh"

    - name: "verify-ownership-lookups"
      description: "Confirms dpkg -S /usr/bin/logtail and dpkg -L logtail-utils both resolve correctly (indirectly, by re-checking package/file state)"
      type: "file"
      source: "validation/validate-ownership-lookups.sh"

    - name: "verify-cowsay-recovered"
      description: "Confirms the previously half-configured cowsay package now shows a clean ii status"
      type: "file"
      source: "validation/validate-cowsay-recovered.sh"

teardown:
  keepCluster: false
