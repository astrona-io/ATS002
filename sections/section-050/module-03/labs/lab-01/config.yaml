metadata:
  name: "ats-002-lab-053"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "apt-basics-lab-setup"
      description: "Ensures fail2ban is not installed, and installs ftp with a real config file under /etc so its purge can be verified"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-fail2ban-installed"
      description: "Confirms fail2ban is now cleanly installed"
      type: "file"
      source: "validation/validate-fail2ban-installed.sh"

    - name: "verify-ftp-purged"
      description: "Confirms ftp is fully purged (not just removed) -- package gone and /etc/ftp* config gone"
      type: "file"
      source: "validation/validate-ftp-purged.sh"

    - name: "verify-autoremove-clean"
      description: "Confirms no orphaned auto-installed packages remain (apt autoremove --dry-run reports nothing to remove)"
      type: "file"
      source: "validation/validate-autoremove-clean.sh"

teardown:
  keepCluster: false
