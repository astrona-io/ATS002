metadata:
  name: "ats-002-lab-026"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "lab-026-podman-and-pilot-user"
      description: "Installs Podman and creates the user pilot with subordinate ID ranges, without lingering"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-rootless-container"
      description: "Confirms pilot runs the container relay from docker.io/library/nginx:alpine, published on host port 8090"
      type: "file"
      source: "validation/validate-container.sh"

    - name: "verify-linger"
      description: "Confirms lingering is enabled for pilot"
      type: "file"
      source: "validation/validate-linger.sh"

    - name: "verify-image-id-file"
      description: "Confirms /home/pilot/relay-image-id.txt holds the image ID of the container relay"
      type: "file"
      source: "validation/validate-image-id.sh"

teardown:
  keepCluster: false
