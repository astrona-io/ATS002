metadata:
  name: "ats-002-lab-040"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-040-setup"
      description: "Installs apparmor-utils and stands up two services (logshipper, metrics-agent), each with a deliberately too-strict AppArmor profile in enforce mode blocking their relocated paths"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-logshipper-enforce"
      description: "Confirms the logshipper AppArmor profile is loaded and in enforce mode, not complain"
      type: "file"
      source: "validation/validate-logshipper-enforce.sh"

    - name: "verify-logshipper-write"
      description: "Confirms logshipper is actively writing to /srv/shiplogs with no fresh AppArmor denials"
      type: "file"
      source: "validation/validate-logshipper-write.sh"

    - name: "verify-metrics-agent-enforce"
      description: "Confirms the metrics-agent AppArmor profile is loaded and in enforce mode, not complain"
      type: "file"
      source: "validation/validate-metrics-agent-enforce.sh"

    - name: "verify-metrics-agent-read"
      description: "Confirms metrics-agent is successfully reading /etc/metrics-agent/remote.conf with no fresh AppArmor denials"
      type: "file"
      source: "validation/validate-metrics-agent-read.sh"

teardown:
  keepCluster: false
