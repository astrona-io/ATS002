metadata:
  name: selinux-commands-bay
  docs:
    guide: docs/overview.md
bootstrap:
  init:
  - name: prepare-enforcing-selinux
    type: file
    source: bootstrap/prepare.sh
    description: Starts a Rocky Linux system with enforcing SELinux and three Apache policy faults
teardown:
  keepCluster: false
runtime:
  type: qemu
  qemu:
  - image:
      type: url
      source: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2
      checksum: sha256:92c206cc6f790c61583247eefe87890f8828420662c17cacf247cec78ab4eec8
    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: false
    arch: x86_64
