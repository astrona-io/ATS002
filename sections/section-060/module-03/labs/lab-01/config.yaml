metadata:
  name: "ats-002-lab-063"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-063-setup"
      description: "Installs Docker, starts the rpmbox Rocky Linux 9 container, enables EPEL, and ensures telnet is installed while fail2ban/mtr are not"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-fail2ban-installed"
      description: "Confirms fail2ban is installed cleanly inside rpmbox"
      type: "file"
      source: "validation/validate-fail2ban-installed.sh"

    - name: "verify-mtr-removed"
      description: "Confirms mtr (the deliberately-bundled unwanted package) is not installed, proving the mixed transaction was undone"
      type: "file"
      source: "validation/validate-mtr-removed.sh"

    - name: "verify-telnet-removed"
      description: "Confirms telnet has been fully removed inside rpmbox"
      type: "file"
      source: "validation/validate-telnet-removed.sh"

    - name: "verify-no-orphans"
      description: "Confirms no orphaned dependency packages remain after cleanup"
      type: "file"
      source: "validation/validate-no-orphans.sh"

teardown:
  keepCluster: false
