metadata:
  name: "ats-002-lab-060"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 3072
    diskSizeGB: 20
    display: false

bootstrap:
  init:
    - name: "lab-060-setup"
      description: "Installs Docker, starts the rpmbox Rocky Linux 9 container, builds and stages a real metrics-shipper RPM, then corrupts the RPM database after the fact"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-rpmdb-healthy"
      description: "Confirms rpm -qa inside rpmbox completes cleanly with no database errors and a plausible package count"
      type: "file"
      source: "validation/validate-rpmdb-healthy.sh"

    - name: "verify-metrics-shipper-installed"
      description: "Confirms metrics-shipper-1.4.0-1.x86_64 is installed inside rpmbox"
      type: "file"
      source: "validation/validate-metrics-shipper-installed.sh"

    - name: "verify-devtools-group-installed"
      description: "Confirms the Development Tools group is installed inside rpmbox, with gcc and make actually present"
      type: "file"
      source: "validation/validate-devtools-group-installed.sh"

    - name: "verify-dnf-check-clean"
      description: "Confirms dnf check inside rpmbox passes cleanly against the rebuilt database after all transactions"
      type: "file"
      source: "validation/validate-dnf-check-clean.sh"

teardown:
  keepCluster: false
