# udev stable-naming playground — a clean sandbox, no task, no grading.
metadata:
  name: "udev-stable-naming"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Ensures udev tooling is present. A second virtual disk with a fixed serial is attached in the runtime block for the rule to match."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      display: false
      sshPasswordAuth: false
      extraDisks:
        - { sizeGB: 1, format: qcow2, serial: "BACKUPWD42" }
