metadata:
  name: "ats-002-lab-013"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "kernel-modules-lab-setup"
      description: "Ensures the pcspkr module is loaded (simulating the annoying-beep starting state) so the student has something real to blacklist and unload"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-dummy-module-loaded-persistently"
      description: "Confirms the dummy module is loaded with numdummies=2 live, and persists both the load and the parameter across reboots"
      type: "file"
      source: "validation/validate-dummy-module.sh"

    - name: "verify-pcspkr-blacklisted"
      description: "Confirms pcspkr is blacklisted, unloaded now, and stays absent after a udevadm trigger re-detection pass"
      type: "file"
      source: "validation/validate-pcspkr-blacklist.sh"

teardown:
  keepCluster: false
