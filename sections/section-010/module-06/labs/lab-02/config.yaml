metadata:
  name: "ats-002-lab-017"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false
    sshPasswordAuth: true

bootstrap:
  init:
    - name: "service-debug-permission-setup"
      description: "metricsd.service runs as User=metricsd and writes to /var/lib/metricsd, which is owned root:root mode 0755 - not writable by metricsd. The daemon exits 1 with 'Permission denied' every start. Unit is enabled, not active."
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-metricsd-running-enabled-and-writing"
      description: "Confirms metricsd.service is active and enabled, still runs as a non-root user, and can now write into its state directory (the permission/ownership problem was genuinely fixed)."
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
