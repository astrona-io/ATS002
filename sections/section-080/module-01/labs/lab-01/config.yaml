metadata:
  name: "ats-002-lab-081"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    # Main disk: the VM's own root filesystem and boot process. Never
    # touched by this lab -- the "broken system" in the scenario lives
    # entirely on the extraDisk below, so this VM stays reachable over
    # SSH the whole time for grading.
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab081-data001"
    display: false

bootstrap:
  init:
    - name: "lab-081-setup"
      description: "Partitions the extraDisk into a stand-in 'data-001' root partition and data partition, and seeds the root partition's /etc/fstab with a deliberately mistyped UUID"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-fstab-fixed"
      description: "Confirms /etc/fstab on the stand-in disk's root partition now references the data partition's real UUID"
      type: "file"
      source: "validation/validate-fstab-fixed.sh"

teardown:
  keepCluster: false
