# Root-Filesystem Repair via chroot (PLAYGROUND) - Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.

metadata:
  name: "chroot-rescue-bench"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    # Main disk: the VM's own root filesystem and boot process. Never
    # touched by this lab -- the "broken system" in the scenario lives
    # entirely on the extraDisk below, so this VM stays reachable over
    # SSH the whole time for grading.
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab081-data001"
    display: false

bootstrap:
  init:
    - name: "prepare"
      description: "Runs every script in bootstrap/ to build the starting state that docs/overview.md describes. No task and no grading."
      type: "folder"
      source: "bootstrap/"
  manifests: []

teardown:
  keepCluster: false
