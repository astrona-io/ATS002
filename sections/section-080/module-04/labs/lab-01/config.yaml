metadata:
  name: "ats-002-lab-084"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    # This lab operates on the VM's own primary disk. Bootstrap only
    # removes the on-disk grub.cfg -- it never touches the currently
    # running kernel, so the VM's CURRENT boot (already in progress
    # before bootstrap runs) stays fully SSH-reachable. Only the NEXT
    # reboot would be affected, which is the honest framing this lab uses
    # ("fix it before that happens" rather than "you're already down").
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-084-setup"
      description: "Removes /boot/grub/grub.cfg (leaving the currently-running kernel untouched) and drops a timestamp marker for validation to compare against"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-grub-config-regenerated"
      description: "Confirms /boot/grub/grub.cfg exists, is non-empty, contains menuentry lines, and was regenerated after bootstrap ran"
      type: "file"
      source: "validation/validate-grub-config-regenerated.sh"

    - name: "verify-grub-installed"
      description: "Checks regenerated GRUB files without changing the bootloader; lifecycle CI verifies a reboot"
      type: "file"
      source: "validation/validate-grub-installed.sh"

teardown:
  keepCluster: false
