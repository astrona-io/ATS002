# Password Reset With a Rescue Shell (PLAYGROUND) - Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.

metadata:
  name: "password-reset-bench"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    # Main disk: the VM's own root filesystem and boot process. Never
    # touched by this lab -- the "locked-out system" in the scenario
    # lives entirely on the extraDisk below, so this VM stays reachable
    # over SSH the whole time for grading.
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 1
        serial: "lab082-data001"
    display: false

bootstrap:
  init:
    - name: "prepare"
      description: "Runs every script in bootstrap/ to build the starting state that docs/overview.md describes. No task and no grading."
      type: "folder"
      source: "bootstrap/"
  manifests: []

teardown:
  keepCluster: false
